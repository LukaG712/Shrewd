[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chauncey"
version = "1.0.0"
description = "LLM provider abstraction for the Evershade ecosystem"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "LukaG712"}]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
]

[project.urls]
Homepage = "https://github.com/LukaG712/Chauncey"
Repository = "https://github.com/LukaG712/Chauncey"

[project.optional-dependencies]
dev = ["pytest==8.3.0", "pytest-asyncio==0.24.0", "pytest-timeout==2.3.1", "ruff==0.9.0"]

[tool.setuptools.packages.find]
include = ["chauncey*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
